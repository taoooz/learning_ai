<h2>学习卡片设计</h2>
<p class="subtitle">每个单元展示几张卡片？什么格式？</p>

<div class="options">
  <div class="option" data-choice="single" onclick="selectOption(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>单张大字卡片</h3>
      <p>1张卡片，大字展示核心概念 + 简单图示，左右滑动切换</p>
    </div>
  </div>
  <div class="option" data-choice="3-cards" onclick="selectOption(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>3张递进卡片</h3>
      <p>3张卡片，由浅入深，第一张"是什么"→ 第二张"为什么"→ 第三张"怎么记"</p>
    </div>
  </div>
  <div class="option" data-choice="5-cards" onclick="selectOption(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>5张完整卡片</h3>
      <p>5张卡片，更完整的知识点拆解，适合较复杂的主题</p>
    </div>
  </div>
</div>

<div id="doneButton" style="display:none;margin-top:24px;text-align:center;">
  <button onclick="submitAndContinue()" style="background:#4A90D9;color:white;border:none;padding:14px 32px;border-radius:25px;font-size:16px;cursor:pointer;">
    选好了，继续 →
  </button>
</div>

<script>
let selectedChoice = null;

function selectOption(el) {
  document.querySelectorAll('.option').forEach(o => o.style.borderColor = '#eee');
  el.style.borderColor = '#4A90D9';
  selectedChoice = el.dataset.choice;
  document.getElementById('doneButton').style.display = 'block';
}

function submitAndContinue() {
  if (selectedChoice) {
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/.events';
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'data';
    input.value = JSON.stringify({type:'done', choice:selectedChoice, timestamp:Date.now()});
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
  }
}
</script>
