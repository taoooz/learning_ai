<h2>视觉风格选择</h2>
<p class="subtitle">移动端优先 · 哪种风格更适合这个产品？</p>

<div class="options">
  <div class="option" data-choice="vibrant" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>活力明快（类 Duolingo）</h3>
      <p>明亮的黄色/绿色主调，圆润卡片，活泼插图，友好的游戏化感觉</p>
    </div>
  </div>
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>简约现代</h3>
      <p>大量留白，柔和配色，少量渐变，偏向 Notion/Pinterest 的干净感</p>
    </div>
  </div>
  <div class="option" data-choice="premium" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>沉稳专业</h3>
      <p>深色系或莫兰迪色，精致排版，偏向 Spotify/Apple Music 的品质感</p>
    </div>
  </div>
</div>
